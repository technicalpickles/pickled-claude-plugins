# Default tool routes shipped with the plugin.
# Other plugins can contribute routes via their own hooks/tool-routes.yaml.
# Project-specific routes go in .claude/tool-routes.yaml.

routes:
  # cat heredoc overwriting a file - use Write tool instead.
  # Deliberately narrow: only a standalone `cat > file <<EOF` (or
  # `cat <<EOF > file`) at the start of the command. Appends (`>>`) stay
  # allowed because Write cannot append, and so do commands that chain
  # other work (`cd x && cat > f <<EOF`), which would otherwise need
  # splitting into two calls. In ~57k Bash calls, 38% of cat heredocs were
  # appends and most of the rest sat inside a compound command.
  bash-cat-heredoc:
    tool: Bash
    pattern: "^\\s*cat\\s+(?:>(?!>)\\s*(?:\"[^\"]*\"|'[^']*'|\\S+)\\s*<<-?\\s*['\"]?\\w+['\"]?|<<-?\\s*['\"]?\\w+['\"]?\\s*>(?!>)\\s*\\S)"
    message: |
      Don't use cat with a heredoc to overwrite a file.

      Use the Write tool instead:
        Write(file_path="/path/to/file", content="...")

      Appending (`cat >> file <<EOF`), chaining it after other commands, and
      piping a heredoc to another command are all fine.
    tests:
      - desc: "cat heredoc to file should block"
        input:
          tool_name: Bash
          tool_input:
            command: "cat > file.txt << 'EOF'\nHello\nEOF"
        expect: block
      - desc: "cat heredoc redirected after the delimiter should block"
        input:
          tool_name: Bash
          tool_input:
            command: "cat <<'EOF' > notes.md\nHello\nEOF"
        expect: block
      - desc: "cat heredoc to a quoted path with spaces should block"
        input:
          tool_name: Bash
          tool_input:
            command: "cat > \"my notes.md\" <<'EOF'\nHello\nEOF"
        expect: block
      - desc: "cat heredoc append should allow"
        input:
          tool_name: Bash
          tool_input:
            command: "cat >> notes.md <<'EOF'\nmore\nEOF"
        expect: allow
      - desc: "cat heredoc after cd should allow"
        input:
          tool_name: Bash
          tool_input:
            command: "cd /tmp/work && cat > notes.md <<'EOF'\nHello\nEOF"
        expect: allow
      - desc: "cat heredoc to display without a redirect should allow"
        input:
          tool_name: Bash
          tool_input:
            command: "cat <<'EOF'\nHello\nEOF"
        expect: allow
      - desc: "cat heredoc with pipe should allow"
        input:
          tool_name: Bash
          tool_input:
            command: "cat <<EOF | jq .\n{\"key\": \"value\"}\nEOF"
        expect: allow
      - desc: "cat heredoc inside command substitution should allow"
        input:
          tool_name: Bash
          tool_input:
            command: "jj commit -m \"$(cat <<'EOF'\nCommit message\nEOF\n)\""
        expect: allow
      - desc: "git commit with cat heredoc should allow"
        input:
          tool_name: Bash
          tool_input:
            command: "git commit -m \"$(cat <<'EOF'\nFix the bug\n\nCo-Authored-By: Claude\nEOF\n)\""
        expect: allow
