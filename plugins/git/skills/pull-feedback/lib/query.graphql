query ($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      number
      title
      url
      state
      reviewDecision
      author { login }
      baseRefName
      headRefName
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          originalLine
          comments(first: 50) {
            nodes {
              author { login }
              body
              createdAt
              diffHunk
            }
          }
        }
      }
      # latestReviews omits a reviewer's review entirely once they've been
      # re-requested for another pass (a common "addressed, please look
      # again" workflow) - fetch all reviews and derive "latest per author"
      # ourselves instead.
      reviews(first: 100) {
        nodes {
          author { login }
          state
          submittedAt
          body
        }
      }
    }
  }
}
