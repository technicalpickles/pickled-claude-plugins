name: second-brain plugin tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/second-brain/scripts/**'
      - 'plugins/second-brain/hooks/**'
      - 'plugins/second-brain/.claude-plugin/**'
      - '.github/workflows/second-brain-plugin-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/second-brain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install bats and Claude Code
        run: |
          sudo apt-get update && sudo apt-get install -y bats
          npm install -g @anthropic-ai/claude-code

      - name: Run bats
        run: bats scripts/tests/ hooks/tests/

      - name: Test and validate the plugin's mods
        run: |
          claude plugin test .
          claude plugin validate .
